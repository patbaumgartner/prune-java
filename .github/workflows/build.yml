name: build

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # README promises "JDK 21 or later": test the oldest supported and the current LTS.
    strategy:
      fail-fast: false
      matrix:
        java: ['21', '25']

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      # install, not verify: the Gradle build below resolves prune-core from the
      # local repository.
      - run: ./mvnw -B -ntp install

      # Also validates the checksum of the Gradle wrapper jar before it is executed.
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - run: >-
          ./gradlew build --stacktrace
          -Porg.gradle.java.installations.auto-detect=false
          -Porg.gradle.java.installations.auto-download=false
        working-directory: prune-gradle-plugin

      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-jdk${{ matrix.java }}
          path: |
            **/target/surefire-reports
            prune-maven-plugin/target/it/*/build.log
            prune-gradle-plugin/build/reports/tests/test
          retention-days: 7
