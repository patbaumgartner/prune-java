name: CI

# Every pull request runs the same full build as main: both builds, all tests, the Maven
# integration test, and the Gradle functional test. A pull request that is verified less
# strictly than the branch it targets is not verified.
#
# `push` is limited to main because a pull request from a branch in this repository already
# triggers the `pull_request` build; running both would verify every such branch twice over.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: Build & Test (Java ${{ matrix.java }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # README promises "JDK 21 or later": the oldest supported release and the current LTS.
        java: ['21', '25']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes, so the job has no use for a credential that every plugin
          # and test in the build would otherwise be able to read out of .git/config.
          persist-credentials: false

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      # install, not verify: the Gradle build below resolves prune-core from the local
      # repository.
      - name: Build and verify the Maven reactor
        run: ./mvnw -B -ntp install

      # Also validates the checksum of the Gradle wrapper jar before it is executed.
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      # Gradle properties, not project properties: Gradle 9.7 deprecates -P for these and
      # Gradle 10 removes it.
      - name: Build and verify the Gradle plugin
        run: >-
          ./gradlew build --stacktrace
          -Dorg.gradle.java.installations.auto-detect=false
          -Dorg.gradle.java.installations.auto-download=false
        working-directory: prune-gradle-plugin

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reports-java-${{ matrix.java }}
          path: |
            **/target/surefire-reports
            prune-maven-plugin/target/it/*/build.log
            prune-gradle-plugin/build/reports/tests/test
          retention-days: 7
          if-no-files-found: ignore

  # The Maven plugin has to run on Maven 4 as well as 3.9. The wrapper legs above cover 3.9;
  # this leg builds the reactor with Maven 4, and the invoker IT then forks that same Maven to
  # run the packaged plugin. Dependabot does not track this pin: bump the version and its
  # SHA-512 (from downloads.apache.org/maven/maven-4/<version>/binaries) together.
  maven4:
    name: Build & Test (Maven 4)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MAVEN_VERSION: 4.0.0-rc-6
      MAVEN_SHA512: 8167e73d93cff9fc120fc783b8d48e93a55ef744ff189b5cbd0afec84a1455881eac7ba613ddb1e82599c64135e891d9f9bf05874f2778fc1ab4728fd17dfdd9
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Install Maven ${{ env.MAVEN_VERSION }}
        run: |
          curl -fsSL -o maven.zip "https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/${MAVEN_VERSION}/apache-maven-${MAVEN_VERSION}-bin.zip"
          echo "${MAVEN_SHA512}  maven.zip" | sha512sum -c -
          unzip -q maven.zip -d "${RUNNER_TEMP}"
          echo "${RUNNER_TEMP}/apache-maven-${MAVEN_VERSION}/bin" >> "${GITHUB_PATH}"

      - name: Build and verify with Maven 4
        run: mvn -v && mvn -B -ntp install

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reports-maven4
          path: |
            **/target/surefire-reports
            prune-maven-plugin/target/it/*/build.log
          retention-days: 7
          if-no-files-found: ignore

  # The POM pins project.build.outputTimestamp and the Gradle build strips archive timestamps
  # so that anyone can rebuild a tag and compare the result against Maven Central. That
  # promise is only worth making if something checks it, so every published jar is built
  # twice here and compared byte for byte. One JDK only: reproducibility is a claim about
  # rebuilding the same source with the same toolchain, and javac is not obliged to emit
  # identical bytecode across major versions. JDK 21 is what the release job uses.
  reproducible:
    name: Reproducible build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Build the published artifacts twice and compare
        run: |
          set -euo pipefail
          checksums() {
            find prune-core/target prune-cli/target prune-lsp/target prune-maven-plugin/target \
              prune-gradle-plugin/build/libs -maxdepth 1 -name '*.jar' -exec sha256sum {} + | sort -k2
          }
          build() {
            ./mvnw -B -ntp -DskipTests -Dinvoker.skip=true clean install
            (cd prune-gradle-plugin && ./gradlew clean jar sourcesJar javadocJar --no-build-cache \
              -Dorg.gradle.java.installations.auto-detect=false \
              -Dorg.gradle.java.installations.auto-download=false)
          }
          build && checksums > "${RUNNER_TEMP}/first.sha256"
          build && checksums > "${RUNNER_TEMP}/second.sha256"
          if ! diff -u "${RUNNER_TEMP}/first.sha256" "${RUNNER_TEMP}/second.sha256"; then
            echo "::error::The published jars are not byte-for-byte reproducible. Something in the build is capturing the wall clock, the file order, or the build path."
            exit 1
          fi
          cat "${RUNNER_TEMP}/first.sha256"
