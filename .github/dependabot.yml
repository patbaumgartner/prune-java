# One owner per ecosystem. Security updates are enabled in the repository settings;
# this file adds routine version updates so the SHA-pinned actions and the library
# versions in both builds do not drift silently.
version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    groups:
      maven-plugins:
        patterns:
          - "org.apache.maven*"
          - "org.codehaus.mojo*"
      test:
        patterns:
          - "org.junit*"
    open-pull-requests-limit: 5

  - package-ecosystem: gradle
    directory: /prune-gradle-plugin
    schedule:
      interval: weekly
    groups:
      test:
        patterns:
          - "org.junit*"
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"
