version: 2
updates:
- package-ecosystem: maven
  directory: /
  schedule:
    interval: weekly
    day: monday
    time: 06:00
    timezone: Europe/Zurich
  groups:
    maven-plugins:
      patterns:
      - org.apache.maven*
      - org.codehaus.mojo*
    formatting:
      patterns:
      - io.spring.javaformat*
      - com.github.ekryd.sortpom*
    test:
      patterns:
      - org.junit*
      - com.code-intelligence*
  ignore:
  - dependency-name: org.apache.maven:maven-plugin-api
  - dependency-name: org.apache.maven.plugins:*
    versions:
    - '>= 4.0.0-alpha-0'
  - dependency-name: org.apache.maven.plugin-tools:*
    versions:
    - '>= 4.0.0-alpha-0'
  open-pull-requests-limit: 5
  labels:
  - dependencies
  - java
  commit-message:
    prefix: build
    prefix-development: build
    include: scope
- package-ecosystem: gradle
  directory: /prune-gradle-plugin
  schedule:
    interval: weekly
    day: monday
    time: 06:00
    timezone: Europe/Zurich
  open-pull-requests-limit: 5
  labels:
  - dependencies
  - java
  commit-message:
    prefix: build
    prefix-development: build
    include: scope
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: weekly
    day: monday
    time: 06:00
    timezone: Europe/Zurich
  groups:
    actions:
      patterns:
      - '*'
  open-pull-requests-limit: 5
  labels:
  - dependencies
  - github_actions
  commit-message:
    prefix: ci
    include: scope
groups:
  multi-step-actions:
    patterns:
    - github/codeql-action/*
    - gradle/actions/*
