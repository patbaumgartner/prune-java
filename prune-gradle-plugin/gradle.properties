# The plugins that exist only for Gradle; settings.gradle applies them at these versions and
# Dependabot bumps them here. Every version shared with the Maven reactor (the analyzers, the
# formatter, JUnit, prune-core itself) is read from ../pom.xml instead, so it is bumped once.
errorproneGradlePluginVersion=5.1.1
nullawayGradlePluginVersion=3.2.0
spotbugsGradlePluginVersion=6.5.11
