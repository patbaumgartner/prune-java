plugins {
    id 'java-gradle-plugin'
}

group = 'com.patbaumgartner'
version = '0.1.0-SNAPSHOT'

repositories {
    // prune-core is built by the Maven reactor at the repository root; run
    // "./mvnw install" there before building this plugin. Only that group is
    // served from the local repository so everything else resolves reproducibly.
    mavenLocal {
        content {
            includeGroup 'com.patbaumgartner'
        }
    }
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

dependencies {
    implementation "com.patbaumgartner:prune-core:${version}"

    testImplementation platform('org.junit:junit-bom:5.11.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation gradleTestKit()
}

gradlePlugin {
    plugins {
        pruneJava {
            id = 'com.patbaumgartner.prune-java'
            implementationClass = 'com.patbaumgartner.prune.gradle.PruneGradlePlugin'
            displayName = 'Prune Java Plugin'
            description = 'Conservative dead-code analysis for Java projects'
        }
    }
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()

    // SampleProjectFunctionalTest reads samples/gradle-sample, which lives outside this
    // build. Without declaring it, Gradle would serve a cached result after the sample
    // changed. PathSensitivity.RELATIVE keeps the cache key portable across checkouts.
    inputs.dir(layout.projectDirectory.dir('../samples/gradle-sample'))
            .withPropertyName('gradleSample')
            .withPathSensitivity(PathSensitivity.RELATIVE)
}
